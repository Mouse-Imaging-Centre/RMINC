name: R Tests

on:
  push:
    branches: [ develop, master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/README*'
      - '.github/workflows/pkgdown.yaml'
  pull_request:
    branches: [ develop, master ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/README*'
      - '.github/workflows/pkgdown.yaml'

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r-version: ['devel', 'release', 'oldrel-1', 'oldrel-2']

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libhdf5-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            freeglut3-dev \
            cmake \
            git \
            lsof \
            autoconf \
            tidy
          # The runner's TeX has no inconsolata.sty, so build the PDF
          # manual with the default fonts
          echo "R_RD4PDF=times,hyper" >> "$GITHUB_ENV"

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5 cmake autoconf automake libtool tidy-html5 pandoc
          brew install --cask basictex
          echo "/Library/TeX/texbin" >> $GITHUB_PATH
          eval "$(/usr/libexec/path_helper)"
          sudo tlmgr update --self
          sudo tlmgr install inconsolata helvetic psnfss

      # R-devel on macOS has no CRAN binary packages yet, so packages such
      # as data.table are built from source. They need static libraries
      # from the CRAN macOS recipes (here gettext for libintl.h) in
      # /opt/R/<arch>, where the CRAN build of R looks for them.
      - name: Install CRAN macOS libraries for source builds (R-devel)
        if: runner.os == 'macOS' && matrix.r-version == 'devel'
        run: |
          sudo SILENT_INSTALL_R=1 Rscript -e \
            'source("https://mac.R-project.org/bin/install.R"); install.libs("gettext")'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools

      - name: Build and install package
        run: |
          R CMD build .
          R CMD INSTALL RMINC*.tar.gz

      # mincTFCE runs the TFCE program from minc-stuffs. TFCE is a Python
      # script that uses pyminc, and pyminc loads a shared libminc2 from
      # $MINC_TOOLKIT/lib. This shared libminc is separate from the static
      # one that the RMINC configure script builds. pyminc needs
      # miget_version, which is in the MINC1 part of libminc.
      - name: Install TFCE from minc-stuffs
        env:
          LIBMINC_SHA: e71e590bc98b3fc3f05b2615dd80151a62e2fcc4
          MINC_STUFFS_SHA: 0bfb834896e91a540774607ca7817ca8fcf41573
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y --no-install-recommends libnetcdf-dev ninja-build
            prefix_path=/usr
          else
            brew install netcdf ninja
            prefix_path="$(brew --prefix)"
          fi
          git clone --quiet https://github.com/BIC-MNI/libminc "$RUNNER_TEMP/libminc-src"
          git -C "$RUNNER_TEMP/libminc-src" checkout --quiet "$LIBMINC_SHA"
          git -C "$RUNNER_TEMP/libminc-src" submodule update --quiet --init --recursive
          cmake -G Ninja -S "$RUNNER_TEMP/libminc-src" -B "$RUNNER_TEMP/libminc-build" \
            -DCMAKE_INSTALL_PREFIX="$HOME/libminc-shared" \
            -DCMAKE_PREFIX_PATH="$prefix_path" \
            -DLIBMINC_BUILD_SHARED_LIBS=ON \
            -DLIBMINC_MINC1_SUPPORT=ON \
            -DLIBMINC_BUILD_EZMINC=OFF \
            -DBUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/libminc-build"
          cmake --install "$RUNNER_TEMP/libminc-build"

          python3 -m venv "$HOME/minc-stuffs"
          "$HOME/minc-stuffs/bin/pip" install --quiet numpy scipy pyminc
          curl -fsSL -o "$HOME/minc-stuffs/bin/TFCE" \
            "https://raw.githubusercontent.com/Mouse-Imaging-Centre/minc-stuffs/$MINC_STUFFS_SHA/python/TFCE"
          sed -i.bak "1s|.*|#!$HOME/minc-stuffs/bin/python|" "$HOME/minc-stuffs/bin/TFCE"
          chmod +x "$HOME/minc-stuffs/bin/TFCE"

          echo "MINC_TOOLKIT=$HOME/libminc-shared" >> "$GITHUB_ENV"
          echo "$HOME/minc-stuffs/bin" >> "$GITHUB_PATH"
          MINC_TOOLKIT="$HOME/libminc-shared" "$HOME/minc-stuffs/bin/TFCE" --help > /dev/null

      - name: Run R CMD check
        run: |
          R CMD check --as-cran --no-install RMINC*.tar.gz

      - name: Show R CMD check log
        if: always()
        run: |
          if [ -f RMINC.Rcheck/00check.log ]; then
            cat RMINC.Rcheck/00check.log
          fi

      - name: Run tests
        run: |
          Rscript -e "\
          testr <- devtools::test(); \
          testr <- as.data.frame(testr); \
          if(any(testr\$error) || any(testr\$warning > 0)) \
            stop('Found failing tests') \
          "

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-results-${{ matrix.os }}-R${{ matrix.r-version }}
          path: RMINC.Rcheck/
